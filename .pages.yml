media: media

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: content/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date, tags, draft]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Publish Date
        type: date
        required: true

      - name: description
        label: Excerpt
        type: text
        description: Short summary for the blog listing page

      - name: image
        label: Cover Image
        type: image

      - name: tags
        label: Tags
        type: select
        options:
          multiple: true
          creatable: true
          values:
            - News
            - Opinion
            - Tutorial
            - Lifestyle
            - Technology
            - Politics

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: body
        label: Content
        type: rich-text